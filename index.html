<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Резюме</title>
    <meta
      name="keywords"
      content="резюме, работа, разработка, веб-разработка, сайт, верстка"
    />
    <meta
      name="description"
      content="Это мой сайт-резюме, на котором вы можете узнать информацию обо мне, как о специалисте"
    />
    <link
      rel="shortcut icon"
      href="https://w7.pngwing.com/pngs/330/782/png-transparent-human-skin-color-light-skin-the-writing-hand-hand-write-hand-human-skin-color-writing-thumbnail.png"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="bio">
        <div class="photo">
          <img src="photo.jpg" width="400" alt="photo" />
        </div>
        <div class="info">
          <h1>Андрей Майоров</h1>
          <p>
            Я основатель собственного агентства по созданию веб-сайтов
            <strong>AnDysite.</strong>
          </p>
          <p>
            Я люблю путешествовать, заниматься спортом и создавать
            <strong>продающие сайты.</strong>
          </p>
          <h3>Социальные сети:</h3>
          <a href="https://t.me/indstrplnt" target="_blank">Telegram</a>
          |
          <a href="https://vk.com/indstrplnt" target="_blank">VK</a>
        </div>
      </div>

      <div class="card job">
        <h2>Опыт работы</h2>
        <table class="table">
          <tbody>
            <tr>
              <td>Я.Еда</td>
              <td>Курьер</td>
              <td>2024 - 2025</td>
            </tr>
            <tr>
              <td>Фриланс</td>
              <td>Веб-дизайнер</td>
              <td>2025 - н. вр.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="card contact">
        <h2>Связаться со мной</h2>
        <form>
          <div class="row">
            <div class="input">
              <label for="text">Ваше имя:</label>
              <input type="text" id="text" placeholder="Введите имя" />
            </div>
            <div class="input">
              <label for="email">Ваш email:</label>
              <input type="email" id="email" placeholder="Введите email" />
            </div>
          </div>

          <div class="input">
            <label for="message">Ваше сообщение:</label>
            <br />
            <textarea
              cols="40"
              rows="5"
              placeholder="Введите сообщение..."
            ></textarea>
          </div>
          <button class="btn" type="submit">Отправить</button>
        </form>
      </div>
    </div>
  </body>
</html>
